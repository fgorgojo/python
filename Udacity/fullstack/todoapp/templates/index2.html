<html>
  <head>
    <title>Todo App</title>
  </head>
  <body>
    <form action="/todos/create" method="post">
      <input name="description" type="text" placeholder="Enter todo description">
      <button type="submit">Add Todo</button> 
    </form>
    <ul>
      {% for d in data %}
      <li>{{ d.description }}</li>
      {% endfor %}
    </ul>
  </body>
</html>
